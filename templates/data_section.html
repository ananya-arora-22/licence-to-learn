{% extends "base.html" %}
{% import "macros/ui.html" as ui %}

{% block breadcrumb %}
{{ ui::breadcrumb(current=section.title) }}
{% endblock %}

{% block content %}
<section class="wrap page">
  <h1>{{ section.title }}</h1>
  <div class="prose">{{ section.content | safe }}</div>
</section>
{% endblock %}

{% block scripts %}
  <script src="{{ get_url(path='js/table.js', cachebust=true) | safe }}" defer></script>
  <script src="{{ get_url(path='js/chart.js', cachebust=true) | safe }}" defer></script>
  <script src="{{ get_url(path='js/spend.js', cachebust=true) | safe }}" defer></script>
  <script src="{{ get_url(path='js/cards.js', cachebust=true) | safe }}" defer></script>
{% endblock %}
